<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>U114 · 真实终端输出回放</title><link rel="stylesheet" href="/vendor/xterm.css"><style>body{margin:0;background:#17191f;color:#cbd0dc;font:13px sans-serif}header{padding:12px;display:flex;gap:12px;align-items:center}button,select{font:inherit}main{padding:12px;overflow:auto}#terminal{width:max-content}footer{padding:12px;color:#9ca6b7}</style><header><b>U114 · 真实 CLI / PTY</b><select id="runs"></select><select id="frames"></select><button id="play">按原始时间回放</button><button id="pause">暂停</button><span id="status"></span></header><main><div id="terminal"></div></main><footer>仅解析实际 ANSI 输出；动效来自产品输出，无 CSS 动画。浏览器字体效果不等同原生终端。</footer><script src="/vendor/xterm.js"></script><script>
let term,loaded,generation=0;const status=document.querySelector('#status');
const write=data=>new Promise(resolve=>term.write(data,resolve));
const get=async(path)=>{const response=await fetch(path);if(!response.ok)throw Error(await response.text());return response};
async function load(name){const base='/run/'+encodeURIComponent(name)+'/';const info=await(await get(base+'run.json')).json();const raw=new Uint8Array(await(await get(base+'raw.bin')).arrayBuffer());const chunks=(await(await get(base+'output.ndjson')).text()).trim().split('\n').filter(Boolean).map(JSON.parse);const steps=(await(await get(base+'steps.ndjson')).text()).trim().split('\n').filter(Boolean).map(JSON.parse);const frames=await(await get(base+'frames')).json();loaded={name,base,info,raw,chunks,steps,frames};document.querySelector('#frames').innerHTML=frames.map(name=>`<option>${name}</option>`).join('');return loaded}
function reset(){if(term)term.dispose();document.querySelector('#terminal').innerHTML='';term=new Terminal({cols:loaded.info.terminal.columns,rows:loaded.info.terminal.rows,scrollback:2000,convertEol:false,allowProposedApi:true,fontFamily:'Menlo, "SF Mono", "PingFang SC", monospace',fontSize:13,lineHeight:1.25,cursorBlink:false,theme:{background:'#101216',foreground:'#d8dce4'}});term.open(document.querySelector('#terminal'))}
async function prefix(limit,step){reset();let at=0;const stepNumber=step;const resizes=loaded.steps.filter(step=>step.action==='resize'&&step.n<=stepNumber&&step.bytes<=limit).sort((a,b)=>a.bytes-b.bytes);for(const resize of resizes){await write(loaded.raw.slice(at,resize.bytes));at=resize.bytes;term.resize(resize.columns,resize.rows)}await write(loaded.raw.slice(at,limit));await document.fonts.ready;await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))}
window.renderFrame=async(name,frame)=>{generation++;await load(name);document.querySelector('#runs').value=name;document.querySelector('#frames').value=frame;const data=await(await get(loaded.base+'frames/'+encodeURIComponent(frame))).json();await prefix(data.bytes,data.step);status.textContent=`${data.columns}×${data.rows} · 字节 ${data.bytes} · ${data.label}`;return data};
window.terminalText=()=>Array.from({length:term.rows},(_,i)=>term.buffer.active.getLine(term.buffer.active.viewportY+i)?.translateToString(true)||'').join('\n');
async function play(){const own=++generation;reset();const start=performance.now(),first=loaded.chunks[0]?.at??0;let resizeIndex=0;const resizes=loaded.steps.filter(step=>step.action==='resize');for(const chunk of loaded.chunks){const delay=chunk.at-first-(performance.now()-start);if(delay>0)await new Promise(resolve=>setTimeout(resolve,delay));if(own!==generation)return;while(resizeIndex<resizes.length&&resizes[resizeIndex].bytes<=chunk.offset){const resize=resizes[resizeIndex++];term.resize(resize.columns,resize.rows)}await write(loaded.raw.slice(chunk.offset,chunk.offset+chunk.length));status.textContent=`原始时间 ${(chunk.at-first).toFixed(0)} ms · ${chunk.offset+chunk.length} 字节`}status.textContent+=' · 输出结束'}
window.replay=play;document.querySelector('#play').onclick=play;document.querySelector('#pause').onclick=()=>generation++;
document.querySelector('#runs').onchange=async(event)=>{await load(event.target.value);await window.renderFrame(loaded.name,loaded.frames.at(-1))};document.querySelector('#frames').onchange=event=>window.renderFrame(loaded.name,event.target.value);
(async()=>{const runs=await(await get('/manifest')).json();document.querySelector('#runs').innerHTML=runs.map(name=>`<option>${name}</option>`).join('');await load(runs.at(-1));document.querySelector('#runs').value=loaded.name;await window.renderFrame(loaded.name,loaded.frames.at(-1));window.ready=true})().catch(error=>status.textContent=String(error));
</script></html>
